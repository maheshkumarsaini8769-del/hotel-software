<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpiceHub - Staff Workstation Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .navbar {
      height: 56px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    .brand-logo {
      font-size: 20px;
      line-height: 1;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: #dc2626;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Portals Navigation Buttons */
    .portals-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #020617;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    .portal-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease-in-out;
    }

    .portal-btn:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.06);
    }

    .portal-btn.active {
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .portal-btn.active.admin-btn { background: #4f46e5; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35); }
    .portal-btn.active.cashier-btn { background: #059669; box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35); }
    .portal-btn.active.kds-btn { background: #d97706; box-shadow: 0 2px 8px rgba(217, 119, 6, 0.35); }
    .portal-btn.active.waiter-btn { background: #e11d48; box-shadow: 0 2px 8px rgba(225, 29, 72, 0.35); }
    .portal-btn.active.reception-btn { background: #0891b2; box-shadow: 0 2px 8px rgba(8, 145, 178, 0.35); }

    /* Environment Switcher & Control Buttons */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .env-toggle {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .env-toggle:hover {
      background: #334155;
      color: #ffffff;
    }

    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #475569;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Webview Container */
    .webview-wrapper {
      flex: 1;
      position: relative;
      background: #0f172a;
      overflow: hidden;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background: #0f172a;
    }

    /* Loading Bar */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #34d399);
      transition: width 0.3s ease, opacity 0.3s ease;
      z-index: 50;
      opacity: 0;
    }

    .progress-bar.active {
      opacity: 1;
      width: 75%;
    }

    .progress-bar.complete {
      width: 100%;
      opacity: 0;
    }

    /* Fallback Alert Banner */
    .connection-banner {
      position: absolute;
      bottom: 20px;
      right: 20px;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
    }

    .connection-banner.visible {
      display: flex;
    }

    .banner-title {
      font-size: 13px;
      font-weight: 700;
      color: #f87171;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .banner-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .banner-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .banner-btn {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .banner-btn.primary {
      background: #2563eb;
      color: white;
    }

    .banner-btn.secondary {
      background: #334155;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand-section">
      <span class="brand-logo">🌶️</span>
      <div class="brand-title">
        SpiceHub
        <span class="brand-badge">Staff</span>
      </div>
    </div>

    <!-- 5 Staff Portal Buttons -->
    <nav class="portals-group">
      <button class="portal-btn admin-btn active" data-portal="admin" title="Management & Hotel Operations">
        <span>🏢</span> Admin
      </button>
      <button class="portal-btn cashier-btn" data-portal="cashier" title="POS, Billing & Cashiering">
        <span>💳</span> Cashier
      </button>
      <button class="portal-btn kds-btn" data-portal="kds" title="Kitchen Display System">
        <span>🍳</span> KDS
      </button>
      <button class="portal-btn waiter-btn" data-portal="waiter" title="Waiter Floor Ordering Terminal">
        <span>🍽️</span> Waiter
      </button>
      <button class="portal-btn reception-btn" data-portal="reception" title="Front Desk Check-In & Guests">
        <span>🛎️</span> Reception
      </button>
    </nav>

    <!-- Controls: Local/Cloud Toggle, Refresh, Fullscreen -->
    <div class="controls-group">
      <button id="envToggleBtn" class="env-toggle" title="Switch between Local Development and Cloud Vercel URLs">
        <span id="envDot" style="width: 7px; height: 7px; border-radius: 50%; background: #10b981;"></span>
        <span id="envLabel">Local (LAN)</span>
      </button>

      <button id="refreshBtn" class="icon-btn" title="Reload Portal (Ctrl+R)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <button id="fullscreenBtn" class="icon-btn" title="Toggle Fullscreen (F11)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Webview Container -->
  <main class="webview-wrapper">
    <div id="progressBar" class="progress-bar"></div>

    <webview 
      id="staffWebview" 
      src="http://localhost:3005" 
      allowpopups 
      webpreferences="contextIsolation=no"
    ></webview>

    <!-- Fallback Alert Banner -->
    <div id="connectionBanner" class="connection-banner">
      <div class="banner-title">
        <span>⚠️</span> Connection Error
      </div>
      <div id="bannerMessage" class="banner-desc">
        Could not connect to the local portal server.
      </div>
      <div class="banner-actions">
        <button id="switchCloudBtn" class="banner-btn primary">Switch to Cloud (Vercel)</button>
        <button id="retryBtn" class="banner-btn secondary">Retry</button>
      </div>
    </div>
  </main>

  <script>
    const { ipcRenderer } = require('electron');

    // Portal URLs Configuration (Localhost vs Cloud Vercel)
    const PORTALS = {
      admin: {
        name: 'Admin ERP',
        local: 'http://localhost:3005',
        cloud: 'https://spicehub-hotel-admin.vercel.app'
      },
      cashier: {
        name: 'Cashier POS',
        local: 'http://localhost:3007',
        cloud: 'https://spicehub-cashier-pos.vercel.app'
      },
      kds: {
        name: 'Kitchen KDS',
        local: 'http://localhost:3003',
        cloud: 'https://spicehub-kitchen-kds.vercel.app'
      },
      waiter: {
        name: 'Waiter Terminal',
        local: 'http://localhost:3002',
        cloud: 'https://spicehub-waiter-mobile.vercel.app'
      },
      reception: {
        name: 'Front Desk Reception',
        local: 'http://localhost:3008',
        cloud: 'https://spicehub-reception-frontdesk.vercel.app'
      }
    };

    let currentPortal = 'admin';
    let currentMode = 'local'; // 'local' or 'cloud'

    const webview = document.getElementById('staffWebview');
    const progressBar = document.getElementById('progressBar');
    const connectionBanner = document.getElementById('connectionBanner');
    const bannerMessage = document.getElementById('bannerMessage');
    const envToggleBtn = document.getElementById('envToggleBtn');
    const envLabel = document.getElementById('envLabel');
    const envDot = document.getElementById('envDot');
    const refreshBtn = document.getElementById('refreshBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const switchCloudBtn = document.getElementById('switchCloudBtn');
    const retryBtn = document.getElementById('retryBtn');

    function getTargetUrl(portalKey, mode) {
      const portal = PORTALS[portalKey];
      return mode === 'cloud' ? portal.cloud : portal.local;
    }

    function switchPortal(portalKey) {
      currentPortal = portalKey;
      connectionBanner.classList.remove('visible');

      // Update Active Navigation Button Styling
      document.querySelectorAll('.portal-btn').forEach(btn => {
        if (btn.dataset.portal === portalKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const url = getTargetUrl(portalKey, currentMode);
      console.log(`[Staff Desktop] Navigating to ${portalKey}: ${url}`);
      webview.src = url;
    }

    // Portal button click listeners
    document.querySelectorAll('.portal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const portal = btn.dataset.portal;
        if (portal) switchPortal(portal);
      });
    });

    // Environment Toggle (Local vs Cloud)
    envToggleBtn.addEventListener('click', () => {
      currentMode = currentMode === 'local' ? 'cloud' : 'local';
      if (currentMode === 'cloud') {
        envLabel.textContent = 'Cloud (Vercel)';
        envDot.style.background = '#38bdf8';
      } else {
        envLabel.textContent = 'Local (LAN)';
        envDot.style.background = '#10b981';
      }
      switchPortal(currentPortal);
    });

    // Refresh Active Portal
    refreshBtn.addEventListener('click', () => {
      connectionBanner.classList.remove('visible');
      webview.reload();
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      ipcRenderer.send('toggle-fullscreen');
    });

    // Banner Actions
    switchCloudBtn.addEventListener('click', () => {
      currentMode = 'cloud';
      envLabel.textContent = 'Cloud (Vercel)';
      envDot.style.background = '#38bdf8';
      switchPortal(currentPortal);
    });

    retryBtn.addEventListener('click', () => {
      connectionBanner.classList.remove('visible');
      webview.reload();
    });

    // Webview Loading and Error Handlers
    webview.addEventListener('did-start-loading', () => {
      progressBar.classList.add('active');
      progressBar.classList.remove('complete');
    });

    webview.addEventListener('did-stop-loading', () => {
      progressBar.classList.remove('active');
      progressBar.classList.add('complete');
      setTimeout(() => {
        progressBar.classList.remove('complete');
      }, 400);
    });

    webview.addEventListener('did-fail-load', (e) => {
      progressBar.classList.remove('active');
      if (e.errorCode !== -3) { // ignore aborts
        bannerMessage.textContent = `Unable to reach ${PORTALS[currentPortal].name} (${currentMode === 'local' ? 'Local Port' : 'Cloud'}). Error: ${e.errorDescription || e.errorCode}`;
        connectionBanner.classList.add('visible');
      }
    });

    // Keyboard Shortcuts (F5 or Ctrl+R to reload, F11 for fullscreen)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
        e.preventDefault();
        webview.reload();
      }
      if (e.key === 'F11') {
        e.preventDefault();
        ipcRenderer.send('toggle-fullscreen');
      }
    });
  </script>
</body>
</html>
