services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spicehub_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/spicehub_dev?replicaSet=rs0
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=spicehub_super_secret_jwt_key_2026_production
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - spicehub_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7.0
    container_name: spicehub_mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: spicehub_dev
    volumes:
      - spicehub_mongo_data:/data/db
    networks:
      - spicehub_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}).ok }' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7.2-alpine
    container_name: spicehub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - spicehub_redis_data:/data
    networks:
      - spicehub_network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  spicehub_mongo_data:
    name: spicehub_mongo_data
  spicehub_redis_data:
    name: spicehub_redis_data

networks:
  spicehub_network:
    name: spicehub_network
    driver: bridge
