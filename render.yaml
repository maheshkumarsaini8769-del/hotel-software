services:
  - type: web
    name: spicehub-socket-server
    env: node
    plan: free
    region: oregon
    rootDir: packages/socket-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SOCKET_SECRET
        value: spicehub-super-secret-socket-token-2026
      - key: JWT_SECRET
        value: spicehub-enterprise-jwt-super-secret-token-key-2026
